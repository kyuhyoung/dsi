# 과제(Project) 정의 — 사용자는 이 'name'(상위 레벨 과제)만 고른다.
# rfp/form 파일 매핑은 내부용 — 사용자에게 노출하지 않는다.
#
# 새 과제 추가 = 아래에 한 항목(name·rfp·form) 추가하면 끝. 코드 수정 0.
# rfp/form 은 samples/rfp_downloaded/ 기준 파일명. (form 은 빈칸 채울 .hwp/.hwpx 양식)
# 둘 다 존재해야 드롭다운에 노출된다(없으면 자동 숨김).

projects:
  - name: "농식품 AI 응용제품 신속상용화 지원사업"
    rfp: "농식품 분야 「AI 응용제품 신속상용화 지원사업」 모집 공고.hwp"
    form: "[양식] 농식품 분야 「AI 응용제품 신속상용화 지원사업」.hwp"

  - name: "민군규격표준화 사업 (26년)"
    rfp: "26년_민군규격표준화_공고문.hwp"
    form: "26년_민군규격표준화_제안서양식.hwpx"
