# 비전 내용 인덱스 — 이미지를 보고 만든 내용 캡션. 파일명 무관, 내용으로 검색.
images:
  - file: Gemini_Generated_Image_n9vy5fn9vy5fn9vy.png
    content_text: "정밀농업 원격탐사 파이프라인 인포그래픽. 좌측 데이터 수집부에 지구관측 위성(Earth Observation Satellite), 통신 안테나·기지국, 클라우드, 멀티스펙트럴 카메라를 단 드론(UAV)·센서, 농경지 필지가 그려져 있음. RGB 영상·다중분광(multispectral) 영상 타일, 고해상도 다중분광 지도(orthomosaic)·3D 필드 모델로 변환. 중앙은 데이터센터 서버랙과 AI 뇌(인공신경망·뉴럴넷) 아이콘으로 표현된 처리·분석(Processing and Analysis). 우측 산출물은 식생 건강도 지도(Vegetation Health Map), 작물 스트레스 분석 지도(Crop Stress Analysis Map), 생육 모니터링 차트(Growth Monitoring Chart), 토양 수분 지도(Soil Moisture Map), 비료 시비 처방(Nutrient Application Plan)을 히트맵·등치선 색상(녹색·적색·황색)으로 표현. 모바일·태블릿·종이 리포트 출력. 키워드: 위성영상, 드론, 항공영상, 무인기, 원격탐사, 다중분광, 정밀농업, 스마트팜, 작황, 작물 생육, 식생지수, NDVI, 객체탐지, 토양수분, 시비처방, 농경지 모니터링, GIS, 지도 제작, 클라우드, AI 분석, 데이터 파이프라인."
  - file: ai_workflow_3layer.png
    content_text: "다비오 AI 업무 혁신 3단계 구축 체계 다이어그램(한국어). 부제 '지식 기반의 추론과 자동화로 가장 똑똑하게 일하는 AI 동료 구현'. 세로 3단계 구성: 1) Input 구축 — 전사 지식 베이스 구축(NotebookLM 등 지식 적재), 2) Output 구축 — AI가 산출물 생성하는 업무 구축(RAG 검색·생성), 3) 자동화 구축 — 업무 흐름 자동화. 중앙에 사람·문서·AI 노드 아이콘과 RAG·Reasoning·Agent 흐름, 우측에 PPT·Word·Excel·Data 등 산출물 아이콘. 좌측에 주요 업무·도입 효과 지표(시간 단축·생산성 등) 표시. 3-Layer 기술 구조와 도입 효과(정량 수치) 영역 포함. 키워드: AI 도입 전략, 업무 자동화, 지식베이스, RAG, 에이전트, 생산성, 워크플로, 조직 혁신, 추론, NotebookLM, 단계별 로드맵, 디지털 전환."
  - file: dsi_architecture.png
    content_text: "DSI(Dabeeo Super Intelligence) 전체 아키텍처 블록 다이어그램(한국어). 위에서 아래로 계층 구조: Layer 0 입력(RFP 공고 PDF/Word, 기존 제안서·레퍼런스, 회사 지식/기술 문서, 스타일 가이드 등 양식 템플릿) → Layer 1 전사 지식베이스(Data Layer, NotebookLM, RAG 검색, 문서 적재·임베딩·지식 업데이트) → Layer 2 AI 추론·생성(Reasoning Layer, DSI Orchestrator, Claude 의도 파악·태스크 분해·조율) → Layer 3 자동화 워크플로(Automation Layer). 추론 계층에 Agent 1 RFP 분석, Agent 2 제안서 작성, Agent 3 PPT 변환 세 박스가 병렬 배치. 하단 산출물은 제안서(Word), 발표자료(PPT), 회사소개서·Email. MVP 단계와 Full Agent 범례 표시. 화살표로 데이터 흐름 연결. 키워드: 시스템 아키텍처, 소프트웨어 구조도, 레이어 다이어그램, 오케스트레이터, 멀티 에이전트, 파이프라인, 제안서 자동화, 지식베이스, RAG, LLM, 워크플로, 데이터 흐름, 모듈 구성."
