# 정부 R&D 사업비(지원금 구성) 표준 어휘 — 범부처 표준 스키마.
# 특정 사업·회사·양식 식별자 0. 새 표기는 *이 yaml 에만* 추가 (코드 수정 0).
#
# 현재 범위: 총괄(지원금 합계) 표 — 국고/자부담/현금/현물 합계 (결정적·완전일반).
# 비목별 배분(T62~T64 류)은 2차 — cross-form 검증용 R&D 양식 확보 후.

schema_version: 1

# 라벨 정규화 (fill_company/finance 와 동일 정책).
normalize:
  strip_chars: ['(', ')', '[', ']', '※', '*', ':', ',', '/', ' ', '　', '·']

# ── 총괄(지원금 합계) 표 ──
summary_table:
  # 헤더 라벨(정규화) → 역할. 다양한 표기 흡수.
  roles:
    지원금합계: total
    사업비합계: total
    사업비총계: total
    총사업비: total
    국고지원금: gov
    정부지원금: gov
    보조금: gov
    자기부담금: self
    자부담금: self
    현금: cash
    현물: in_kind
  # 1단 헤더(최상위 행) vs 2단 헤더(자부담 하위). 값은 헤더 레벨별 데이터 행에 매핑.
  primary_roles: [total, gov, self]
  sub_roles: [cash, in_kind]
  # 이 역할이 모두 있는 표만 총괄표로 인식 (false positive 차단).
  recognize_required: [gov, self]
  # 값 표기 포맷 — 셀이 2단락(숫자 / 주석)일 때 num=P0, note=P1 분리 출력.
  # (양식 총괄 셀 관행: 숫자줄 + "(…%)" 주석줄). 단락 1개면 note 무시.
  format:
    total:   {num: '{amt}억원', note: '(국고+자기부담금)'}        # 총액 — 예시 주석(총 N社 등) 대체
    gov:     {num: '{amt}억원', note: '(지원금 합계의 {pct}%)'}
    self:    {num: '{amt}억원', note: '(지원금 합계의 {pct}%)'}
    cash:    {num: '{amt}억원', note: '(자기부담금의 {pct}%)'}
    in_kind: {num: '{amt}억원', note: '(자기부담금의 {pct}%)'}

# ── 비목별 표 어휘 (B 비목 명세 배치용) ──
# ★ 이 vocab 은 *정부 R&D 연구개발비 비목 체계*(범부처 공통) 전용이다.
#   비R&D 사업유형(일반 용역·물품·공사 등)은 비목 체계가 다르다 — 직접인건비·경비·
#   일반관리비·이윤 등. 그런 양식에는 *해당 유형 비목 vocab 을 이 파일에 추가*해야
#   find_detail_tables 가 인식한다(코드 0, yaml 확장만).
# ★ 미매칭 시(비R&D 양식이라 R&D 비목 어휘가 없음) → 비목별 표 인식 0 = 자연스러운
#   결과(그 양식엔 R&D 비목별 표가 없음). 억지 매칭 없음 → 산출물 영향 0.
# 새 표기는 *이 yaml 에만* 추가 (코드 0). 정규화(strip_chars) 후 substring 매칭.
item_roles:
  인건비: labor
  인력비: labor
  재료비: materials
  연구재료비: materials
  시설장비비: equipment
  연구시설장비비: equipment
  연구장비재료비: equipment
  기자재비: equipment
  연구활동비: activity
  용역비: service
  위탁연구개발비: consign
  위탁비: consign
  간접비: overhead
  회계정산비: settlement
  수용비: misc

# 비목별 표의 *구분 축* 어휘 — 금액 셀이 어느 (재원/형태/주체)인지 판정.
# 배치 라운드(양식 확보 후)에서 셀의 행/열 라벨 매칭에 사용. 인식 단계는 fund 만 사용.
detail_axes:
  fund:          # 재원
    국고지원금: gov
    국고: gov
    정부지원금: gov
    보조금: gov
    자기부담금: self
    자부담금: self
    자부담: self
  form:          # 형태
    현금: cash
    현물: in_kind
  org:           # 주체
    주관기업: lead
    주관: lead
    참여기업: partner
    참여: partner
  aggregate:     # 집계 행
    소계: subtotal
    합계: total
    총계: total

# ── 사업비 비율 ──
# 비율(국고/자부담/현금/현물)은 *RFP 명시(사업개요.예산) 또는 CLI(--self-pct/--cash-pct
# /--in-kind-pct) 명시만* 사용한다. **미지정 시 가정 금지** → 총괄표 값 셀을 '(확인 필요)'로
# (CLAUDE.md "명시 안 한 결정은 물어라"). 국고/자부담 비율은 사업유형·공고마다 다른 *전략적
# 결정*이므로 코드 default 로 조용히 채우면 임의 사업에서 틀린 값을 낳는다(overfit).
# (이전 70:30/10:90 fallback 제거 — 정부 R&D 매칭 관행을 임의 사업에 일괄 적용하던 결함.)
ratio_defaults: {}   # fallback 없음 — 미지정이면 (확인 필요)
