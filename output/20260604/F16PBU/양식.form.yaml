- idx: 23
  rows: 1
  cols: 1
  cells:
  - row: 0
    col: 0
    text: '우리 회사는 부패 없는 투명한 기업경영과 공정한 행정이 사회발전과 국가 경쟁력에 중요한 관건이 됨을 깊이 인식하고, 국제적으로도
      경제협력개발기구(OECD) 뇌물방지 협약이 발효되고 부패기업 및 국가에 대한 제재가 강화되는 추세에 맞추어 청렴계약이행서약 취지에 적극적으로
      호응하여 2026년   월   일 국방기술품질원에서 시행하는 F-16 PBU 모의비행장비 성능개선 사업의 입찰 및 계약에 참여함에 있어
      다음 사항을 서약합니다. 1. 입찰가격의 사전공개 및 특정인의 낙찰을 위한 담합을 하거나 다른 업체와 협정․결의 또는 합의하여 입찰의 자유경쟁을
      부당하게 저해하는 일체의 불공정한 행위를 하지 아니한다. 2. 입찰․계약체결 및 계약이행과정에서 관계직원에게 직․간접적으로 금품이나 향응
      등의 뇌물을 제공하기로 약속하거나 제공하지 아니한다. 3. 위 제1호 및 제2호를 위반한 경우에는 낙찰자 결정 취소, 계약 취소․해제․해지,
      또는 입찰참가자격의 제한 등 ｢방위사업법｣에서 규정한 조치를 받더라도 이를 감수하고 국방기술품질원장을 상대로 손해배상을 청구하거나 민․형사상의
      이의를 제기하지 않는다.  4. 회사 임직원이 관계직원에게 뇌물을 제공하거나 담합 등 불공정 행위를 하지 않도록 하고, 내부 비리 제보자에
      대해서도 일체의 불이익을 받지 않도록 한다. 5. 본 건과 관련한 하도급계약의 체결 및 이행에 있어서 원 도급자로서의 우월한 지위를 이용하여
      하도급자로부터 금품을 수수하거나 부당 또는   6. 본 건과 관련한 특정정보의 제공을 관계직원에게 요구하거나 제공받지 않도록 하며, 계약이행과정에서
      알게 된 연구 성과물 등 특정정보를 임의로 제3자에게 제공 또는 누설하지 아니한다. 7. 우리 회사가 낙찰자로 결정될 경우 위의 서약내용을
      그대로 계약특수조건에 명시하고 이행한다.                                                    년    월    일서약자
      :       회사(업체코드 :      ) 대표 또는 임원          (인) 국방기술품질원장 귀하'
    colspan: 1
    rowspan: 1
    inner_ps:
    - sub_idx: 0
