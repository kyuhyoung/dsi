- idx: 24
  rows: 1
  cols: 1
  cells:
  - row: 0
    col: 0
    text: '우리 회사는 F-16 PBU 모의비행장비 성능개선 사업에 관한 건을 취급함에 있어 다음 사항을 준수할 것을 서약합니다.   1.
      제안요청서를 포함하여 취급하는 모든 군사자료가 국가안전보장에 관계될 수 있는 중요한 사항임을 명심하여 시간과 장소에 구애됨이 없이 제반
      보안규정을 준수하여 군사자료를 보호하겠다.   2. 취급하는 업무 이외의 군사비밀을 알려고 하거나 부당한 방법으로 탐지, 수집하지 않겠다.   3.
      군사비밀의 누설은 적을 이롭게 하는 것임을 자각하여 취급 또는 인지한 군사비밀을 누설하지 않겠다.   4. 군사비밀을 탐지, 수집 또는
