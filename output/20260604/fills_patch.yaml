  source: SESSION.md 비즈니스 결정 — 단독신청(컨소시엄 미구성)
  hint_ref:
    left: 주관기업-참여기업협업 추진배경 및 역할
    table_label: 사업계획서 요약(2페이지 내외 작성)
- id: T18_R7_C2
  text: "❍ 핵심기술 및 차별성\n  - 위성·드론·모바일 영상을 단일 파이프라인으로 통합 분석하는 GeoAI 정밀농업 솔루션 Eartheye\
    \ Plantation 을 상용화 대상으로 함.\n  - 초해상화·이미지 정합·의미론적 분할·객체 탐지·변화 탐지·3차원 재건의 6대 AI\
    \ 백본 기술을 자체 보유함.\n    * 팜·작물 객체 탐지 F1-Score 0.98 수준, 식생 건강도 분류 95% 이상, 변화 탐지 16개\
    \ 유형 지원으로 국내 최고 수준의 분석 정밀도를 입증함.\n    * 2023년 세계 최초로 30cm 초고해상도 위성영상을 AI로 분석해\
    \ 임·농업 분야에 상용화한 사례를 확보함.\n❍ 경쟁력 및 시장 진입 전략\n  - 위성의 광역성과 드론 수준의 정밀도를 동시에 확보해 1,000㎢\
    \ 기준 분석 기간을 약 345일에서 약 29일로 단축함(약 12배 단축).\n  - 구독형(SaaS) 기반 면적 단위 과금 모델(연간 1㎢당\
    \ USD 500 수준)로 반복 매출 구조를 구축하고, 국내 공공·농업법인 대상 PoC → 파일럿 → 정식 계약의 단계적 시장 진입을 추진함.\n\
    ❍ 상용화 전략\n  - 협약일로부터 1년 내(타입1) 국내 상용화 완료를 목표로, 인도네시아 KORINDO 4년 장기 계약·SALIM 그룹\
    \ 실증으로 검증된 기술을 국내 농식품 현장에 적용함.\n  - 농협·aT·지자체·농업법인·식품 가공기업을 대상으로 객체 탐지·건강도·변화\
    \ 탐지 기능을 결합한 통합 솔루션을 제공할 계획임.\n"
  source: kb/company/dabeeo/tech-core.md (6대 백본·F1 0.98·16유형·세계최초 30cm), quantitative.md
    §2-1·§7·§3-2
  hint_ref:
    left: 추진전략
    table_label: 사업계획서 요약(2페이지 내외 작성)
- id: T18_R8_C2
  text: "❍ 목표시장 규모 및 전망\n  - 위성영상·공간정보와 AI 분석을 결합한 정밀농업(GeoAI) 시장은 연평균 11.6% 성장하며,\
    \ 2030년까지 약 2조원 규모로 성장할 것으로 전망됨.\n    * 아시아·태평양 지역은 약 14.9% 성장률로 글로벌 평균을 상회함.\n\
    \  - 글로벌 팜오일 시장은 약 110조원 규모이며, 인도네시아·말레이시아가 전 세계 생산량의 80% 이상을 차지하는 고집중 구조임.\n\
    ❍ 시장 현황 및 수요\n  - 농민 1인당 경작 면적이 넓고 인력·고령화 부담이 큰 현장에서 위성+AI 자동 분석을 통한 노동력 절감·생산성\
    \ 향상 수요가 확대됨(당사 적용 시 생산성 약 12% 개선 사례).\n  - 농림축산식품부 디지털농업 정책 가속화로 국내 공공·민간의 GeoAI\
    \ 농업 수요가 본격 확장되는 추세임.\n❍ 주요 고객층\n  - 국내: 농협·aT(한국농수산식품유통공사)·지방자치단체·농업법인·식품 가공기업\
    \ 등 공공 및 산업 수요처를 1차 목표 고객으로 함.\n  - 해외: 인도네시아 KORINDO·SALIM 그룹 등 대형 플랜테이션 기업을\
    \ 기반으로 베트남·말레이시아 등 동남아시아 임·농업 시장으로 확장함.\n"
  source: kb/company/dabeeo/quantitative.md §5-1·§5-2·§2-2, business.md (임·농업 확장경로),
    tech-core.md
  hint_ref:
    left: 목표시장 및 주요 고객층
    table_label: 사업계획서 요약(2페이지 내외 작성)
- id: T18_R9_C2
  text: "❍ 기술 성숙도 기반 실현 근거\n  - 당사는 27개 세부 기술을 연구개발 중이며 약 85%가 TRL 7 이상, 59%가 TRL\
    \ 9에 도달해 상용화 기술 역량을 확보함.\n    * 본 사업 신청유형(타입1, TRL 7~8)에 부합하는 실운용 환경 검증 단계를 이미\
    \ 통과함.\n❍ 상용화 실적 기반 실현 근거\n  - 인도네시아 KORINDO 대상 탐지·건강도 99% 이상 정확도로 4년 장기 계약을 수주하고,\
    \ SALIM 그룹 파일럿에서 99% 이상 탐지·100% 건강도 분류를 달성함.\n  - 4개국(인도네시아·말레이시아·베트남·핀란드) 수출\
    \ 실적과 국내 최초 위성영상 분석 해외 상용 계약 체결 경험을 보유함.\n❍ 사업 수행 기반 실현 근거\n  - 석·박사급 포함 전문 연구인력\
    \ 64명과 H200·H100 등 고성능 GPU 기반 연구 인프라(서버 19대·워크스테이션 21대)를 보유해 협약 기간 내 결과 도출이 가능함.\n\
    \  - 농림축산식품부 농식품 모태펀드 투자 포트폴리오에 선정되어 기술성·사업성을 검증받았으며, 누적 약 369억원 투자 유치와 정부지원 과제\
    \ 29건(112.4억원) 수행 경험을 확보함.\n"
  source: kb/company/dabeeo/quantitative.md §3-1·§3-2·§6·§8·§9, investment.md (369억·KORINDO)
  hint_ref:
    left: 실현가능성
    table_label: 사업계획서 요약(2페이지 내외 작성)
